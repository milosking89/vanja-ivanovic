<section class="about">
  <!-- HERO -->
  <header class="hero">
    <div class="orbit-wrap" aria-hidden="true">
      <div class="orbit orbit-1"><span class="planet p1"></span></div>
      <div class="orbit orbit-2"><span class="planet p2"></span></div>
      <div class="orbit orbit-3"><span class="planet p3"></span></div>
      <div class="avatar">🔮</div>
    </div>

    <p class="eyebrow">O autoru</p>
    <h1 class="name">Vanja Ivanović</h1>
    <p class="roles">Astrolog</p>
  </header>

  <!-- CITAT -->
  <figure class="quote">
    <span class="quote-mark" aria-hidden="true">“</span>
    <blockquote>Negde nešto neverovatno čeka da bude otkriveno.</blockquote>
    <figcaption>— Carl Edward Sagan</figcaption>
  </figure>

  <!-- PRIČA -->
  <div class="story">
    @for (item of story; track item.title; let i = $index) {
      <article class="story-card" [style.animation-delay.ms]="i * 120">
        <div class="story-icon">{{ item.icon }}</div>
        <div>
          <h2>{{ item.title }}</h2>
          <p>{{ item.text }}</p>
        </div>
      </article>
    }
  </div>

  <!-- KONTAKT / CTA (zajednička komponenta, ista kao baner na početnoj) -->
  <app-consult-banner />
</section>
